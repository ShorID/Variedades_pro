<!-- biome-ignore-all lint/a11y/noSvgWithoutTitle: <explanation> -->
<!-- biome-ignore-all lint/a11y/useAnchorContent: <explanation> -->
<div class="Categories mt-3">
  <app-breadcrumb />
  <div class="row mt-3 row-gap-3">

    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <div class="row g-2 align-items-end w-100">

            <div class="col">
              <label class="form-label">Búsqueda</label>
              <div class="input-icon">
                <input type="text" class="form-control form-control-rounded"
                  placeholder="Buscar por nombre, marca o código..." [(ngModel)]="searchTerm" (input)="onSearch($event)"
                  autocomplete="off">
                <span class="input-icon-addon">
                  <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                    stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="10" cy="10" r="7" />
                    <line x1="21" y1="21" x2="15" y2="15" />
                  </svg>
                </span>

                <div class="dropdown-menu w-100" [class.show]="filteredProducts.length > 0">
                  <button type="button" class="dropdown-item" *ngFor="let item of filteredProducts"
                    (click)="selectItem(item)">
                    <div class="d-flex flex-column">
                      <span class="fw-bold">{{ item.sub_categoria.nombre }} - {{ item.marca.nombre }} </span>
                      <small class="text-muted">{{ item.codigo }} - {{ item.descripcion }}</small>
                    </div>
                  </button>
                </div>
              </div>
            </div>

            <div class="col-auto">
              <button type="button" class="btn btn-primary d-none d-sm-inline-flex" (click)="openModal()"
                [disabled]="!selectedProduct">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                  stroke-width="2" stroke="currentColor" fill="none">
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                Agregar
              </button>
            </div>

            <div class="col-auto">
              <button type="button" class="btn btn-outline-primary d-none d-sm-inline-flex" (click)="redirectToCreate()">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                  stroke-width="2" stroke="currentColor" fill="none">
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                Crear producto
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>

    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <div class="w-100">
            <div class="row align-items-center">
              <div class="col">
                <div class="page-pretitle">Entradas</div>
                <h2 class="page-title">Listado a registrar</h2>
              </div>
            </div>
          </div>
        </div>
        <div class="card-body p-0">
          <table class="table table-responsive table-vcenter">
            <thead>
              <tr>
                <th>#</th>
                <th class="text-nowrap">Producto</th>
                <th class="text-nowrap">Marca</th>
                <th class="text-nowrap">Código</th>
                <th class="text-nowrap">Costo</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngIf="!selectedProduct && searchTerm === ''">
                <td colspan="5" class="text-center text-muted">No hay productos seleccionados</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="card-footer d-flex align-items-center justify-content-between">
          <span class="text-muted"> Registros listos </span>
          <app-pagination />
        </div>
      </div>
    </div>

  </div>
</div>

<div class="modal modal-blur fade" [class.show]="showModal" [style.display]="showModal ? 'block' : 'none'"
  tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
    <div class="modal-content" *ngIf="showModal">
      <div class="modal-header">
        <h5 class="modal-title">Configurar Producto: {{ selectedProduct?.descripcion }}</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-lg-6 mb-3">
            <label class="form-label">Categoría</label>
            <input type="text" class="form-control" [(ngModel)]="details.category" readonly>
          </div>
          <div class="col-lg-6 mb-3">
            <label class="form-label">Sub-Categoría</label>
            <input type="text" class="form-control" [(ngModel)]="details.subCategory" readonly>
          </div>

          <div class="col-lg-6 mb-3">
            <label class="form-label">Marca</label>
            <input type="text" class="form-control" [(ngModel)]="details.brand" readonly>
          </div>
          <div class="col-lg-6 mb-3">
            <label class="form-label">Modelo</label>
            <input type="text" class="form-control" [(ngModel)]="details.model">
          </div>
        </div>
      </div>

      <div class="modal-body">
        <label class="form-label">Atributos del Producto</label>
        <div class="row">
          <div class="col-4">
            <label class="form-label small text-muted">Talla</label>
            <input type="text" class="form-control" placeholder="Talla" [(ngModel)]="details.size">
          </div>
          <div class="col-4">
            <label class="form-label small text-muted">Color</label>
            <input type="text" class="form-control" placeholder="Color" [(ngModel)]="details.color">
          </div>
          <div class="col-4">
            <label class="form-label small text-muted">Material</label>
            <input type="text" class="form-control" placeholder="Material" [(ngModel)]="details.material">
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-6">
            <label class="form-label">Costo</label>
            <input type="number" class="form-control" [(ngModel)]="details.cost">
          </div>
          <div class="col-6">
            <label class="form-label">Código de Barras</label>
            <input type="text" class="form-control" [(ngModel)]="details.code">
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-link link-secondary" (click)="closeModal()">Cancelar</button>
        <button type="button" class="btn btn-primary ms-auto" (click)="confirmAdd()">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
            stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          Confirmar Ingreso
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop fade show" *ngIf="showModal"></div>
